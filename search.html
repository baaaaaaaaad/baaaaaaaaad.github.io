<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="搜索引擎入口：Bing、百度、Google，可拖拽调整顺序">
    <title>搜索 · baaaaaaaad</title>
    <link rel="icon" href="res/icon/rainbow.png" type="image/png">
    <link rel="stylesheet" href="res/css/index.css">
    <link rel="preload" href="res/icon/bing-color.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="res/icon/baidu-color.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="res/icon/google-color.svg" as="image" type="image/svg+xml">
</head>

<body class="dark-mode">
    <div class="navigation-container">
        <button id="theme-toggle" class="navigation-icon" aria-label="切换主题" aria-pressed="false" title="单击切换主题"><span class="light-icon">🌞</span><span class="dark-icon">🌙</span></button>
        <a href="index.html" class="navigation-icon" aria-label="返回首页" title="返回首页">
            <svg class="navigation-svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M12 3.2 2.8 11h2.4v9h5v-5.6h3.6V20h5v-9h2.4L12 3.2Z"/>
            </svg>
        </a>
    </div>

    <main class="content-container">
        <h1 class="sr-only">搜索</h1>
        <div class="search-container">
            <div class="search-bar">
                <span class="search-leading" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
                        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
                        <path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="搜索..." class="search-input" aria-label="搜索关键词" autocomplete="off" spellcheck="false">
                <button type="button" id="search-clear" class="search-clear" aria-label="清空搜索" title="清空搜索" hidden>
                    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
                        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                </button>
                <div class="search-engines" id="searchEnginesContainer" role="group" aria-label="搜索引擎选择">
                    <button type="button" id="bing-search" draggable="true" class="search-engine-icon" aria-label="使用 Bing 搜索" title="Bing">
                        <img src="res/icon/bing-color.svg" alt="" class="search-engine-img">
                    </button>
                    <button type="button" id="baidu-search" draggable="true" class="search-engine-icon" aria-label="使用百度搜索" title="百度">
                        <img src="res/icon/baidu-color.svg" alt="" class="search-engine-img">
                    </button>
                    <button type="button" id="google-search" draggable="true" class="search-engine-icon" aria-label="使用 Google 搜索" title="Google">
                        <img src="res/icon/google-color.svg" alt="" class="search-engine-img">
                    </button>
                </div>
            </div>
            <p class="search-hint" id="search-hint" aria-live="polite"></p>
        </div>
    </main>

    <script type="module" src="res/js/search.js"></script>
    <script src="res/js/sw-register.js" defer></script>
</body>

</html>
