<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="baaaaaaaaad的个人博客，分享技术文章和生活感悟">
    <meta name="keywords" content="博客,技术,生活,感悟">
    <meta name="author" content="baaaaaaaaad">
    <title>baaaaaaaaad(9A认证)</title>
    <link rel="icon" href="res/icon/rainbow.png" type="image/png">
    <style>
        #slide-stage > .page[aria-hidden="true"] { visibility: hidden; }
    </style>
    <link rel="stylesheet" href="res/css/index.css">
</head>

<body class="dark-mode">
    <div class="background-fallback" aria-hidden="true"></div>
    <video id="rain-background" muted playsinline loop preload="auto" aria-hidden="true" tabindex="-1"></video>
    <audio id="rain-audio" loop preload="auto" src="res/audio/rain.mp3"></audio>

    <div class="slide-stage" id="slide-stage" data-view="home">
    <main class="content-container page" id="main-page" tabindex="-1">
        <h1 class="sr-only">baaaaaaaaad(9A认证)</h1>
        <!-- 时钟 -->
        <div class="clock" id="clock" role="img" aria-label="当前时间" aria-live="off"></div>
        <!-- 日期与今日进度 -->
        <div class="date-block">
            <div class="date" id="date"></div>
            <div class="day-progress" id="day-progress" role="progressbar" aria-label="今日进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="day-progress-track">
                    <div class="day-progress-fill" id="day-progress-fill"></div>
                </div>
                <span class="day-progress-text" id="day-progress-text">今日 0%</span>
            </div>
        </div>
    </main>


    <nav class="slide-navigation" aria-label="页面导航">
        <button type="button" id="rain-audio-toggle" aria-label="播放雨声" aria-pressed="false">🔊</button>
        <button type="button" id="admin-toggle" aria-label="向左进入管理页">⬅️</button>
        <button type="button" id="fullscreen-toggle" aria-label="进入全屏" aria-pressed="false">⬆️</button>
        <button type="button" data-slide="article" aria-controls="article-page">⬇️</button>
        <button type="button" data-slide="search" aria-controls="search-page">➡️</button>
    </nav>


    <section class="page search-page" id="search-page" aria-label="搜索" tabindex="-1" inert aria-hidden="true">
        <button class="back-home-button" data-slide="home">⬅️</button>
        <div class="search-container" id="search-container">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="搜索..." class="search-input">
                <div class="search-engines" id="searchEnginesContainer" role="group" aria-label="搜索引擎选择">
                    <a id="bing-search" role="button" tabindex="0" draggable="true" target="_blank" class="search-engine-icon" aria-label="使用Bing搜索"><img src="res/icon/bing-color.svg" alt="Bing" class="search-engine-img"></a>
                    <a id="baidu-search" role="button" tabindex="0" draggable="true" target="_blank" class="search-engine-icon" aria-label="使用百度搜索"><img src="res/icon/baidu-color.svg" alt="Baidu" class="search-engine-img"></a>
                    <a id="google-search" role="button" tabindex="0" draggable="true" target="_blank" class="search-engine-icon" aria-label="使用Google搜索"><img src="res/icon/google-color.svg" alt="Google" class="search-engine-img"></a>
                </div>
            </div>
        </div>
    </section>

<div class="page" id="article-page" tabindex="-1" inert aria-hidden="true">
    <button class="back-home-button" data-slide="home" aria-label="返回首页" title="返回首页"><span aria-hidden="true">⬆️</span></button>
    <div id="nav-container">
        <nav class="nav-bar" aria-label="文章列表导航">
        </nav>
    </div>
        <header class="article-header">
            <div class="controls" role="search">
                <select id="tag" aria-label="按标签筛选文章"></select>
                <input id="q" type="text" placeholder="搜索标题/标签/摘要" aria-label="搜索文章">
                <label class="draft-toggle" id="draft-toggle" hidden><input id="show-drafts" type="checkbox"> 显示草稿</label>
                <span id="refresh-info" class="refresh-info" role="status" aria-live="polite"></span>
                <button id="refresh-posts" class="panel-icon-button" type="button" aria-label="刷新文章列表" title="刷新文章列表"><span aria-hidden="true">↻</span></button>
            </div>
        </header>
        <section class="article-list-main" aria-label="文章列表">
            <ul id="post-list" aria-label="文章列表"></ul>
            <div class="controls pagination-controls">
<button id="prev" aria-label="上一页" title="上一页">◀</button>
<div id="pagination" class="meta" aria-live="polite"></div>
<button id="next" aria-label="下一页" title="下一页">▶</button>
            </div>
        </section>
        <div id="list-toast" role="status" aria-live="polite"></div>
    </div>

<section class="page" id="admin-page" aria-label="文章管理" tabindex="-1" inert aria-hidden="true">
    <button class="back-home-button" data-slide="home" aria-label="返回首页" title="返回首页"><span aria-hidden="true">➡️</span></button>
    <header class="admin-header">
        <h2>管理 Gist 中的文章与发布状态</h2>
            <section class="admin-panel" aria-labelledby="pat-heading">
                <div class="admin-panel-heading"><div><h2 id="pat-heading">凭据设置</h2><p class="meta">PAT 保存在当前浏览器，请仅授予 gist 权限</p></div></div>
                <div class="controls pat-controls">
                    <div class="pat-input-wrapper"><input id="pat" type="password" aria-label="Personal Access Token" placeholder="输入 PAT（仅 gist 权限）" autocomplete="off" spellcheck="false"><button id="pat-toggle" class="pat-toggle" type="button" aria-label="显示 PAT" title="显示/隐藏">👁</button></div>
                    <button id="pat-save" type="button" aria-label="保存到本地" title="保存到本地">💾</button><button id="pat-clear" type="button" aria-label="清除" title="清除">❌</button>
                </div>
            </section>
        </header>
        <div class="admin-content">
            <section class="admin-panel" aria-labelledby="editor-heading">
                <div class="admin-panel-heading"><h2 id="editor-heading">新建/编辑文章</h2><button id="save" class="admin-primary" type="button" aria-label="保存" title="保存">💾</button><button id="new" type="button" aria-label="新建" title="新建">📄</button></div>
                <div class="admin-form-grid">
                    <label>标题<input id="title" type="text"></label>
                    <label class="admin-slug">Slug<input id="slug" type="text" placeholder="留空自动生成"><span class="admin-form-hint" id="slug-hint"></span></label>
                    <label>标签（逗号分隔）<input id="tags" type="text"></label>
                    <label>状态<select id="status"><option value="published">published</option><option value="draft">draft</option></select></label>
                    <label class="admin-col-span">摘要<input id="summary" type="text"></label>
                    <label class="admin-col-span">正文（Markdown）<textarea id="body" rows="16"></textarea></label>
                    <div class="admin-form-actions admin-col-span"><button id="save-bottom" class="admin-primary" type="button" aria-label="保存" title="保存">💾</button></div>
                </div>
            </section>
        </div>
        <div id="toast" role="status" aria-live="polite"></div>
    </section>
    </div>
    <script type="module" src="res/js/index.js"></script>
    <!-- 预加载关键资源 -->
    <link rel="preload" href="res/icon/bing-color.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="res/icon/baidu-color.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="res/icon/google-color.svg" as="image" type="image/svg+xml">
    <script src="res/js/sw-register.js" defer></script>
</body>

</html>
