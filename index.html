<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="baaaaaaaaad的个人博客，分享技术文章和生活感悟">
    <meta name="keywords" content="博客,技术,生活,感悟">
    <meta name="author" content="baaaaaaaaad">
    <title>baaaaaaaaad(9A认证)</title>
    <link rel="icon" href="res/icon/capitalism.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer>
    <link rel="stylesheet" href="res/css/index.css">
</head>

<body>
    <!-- 主页内容容器 -->
    <div class="content-container page" id="main-page">
        <!-- 时钟 -->
        <div class="clock" id="clock"></div>
        <!-- 搜索框 -->
        <div class="search-container">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="搜索..." class="search-input">
                <div class="search-engines" id="searchEnginesContainer" role="group" aria-label="搜索引擎选择">
                    <a id="bing-search" draggable="true" target="_blank" class="search-engine-icon" onclick="searchWithEngine('bing')" aria-label="使用Bing搜索"><img src="res/icon/bing-color.svg" alt="Bing" class="search-engine-img"></a>
                    <a id="baidu-search" draggable="true" target="_blank" class="search-engine-icon" onclick="searchWithEngine('baidu')" aria-label="使用百度搜索"><img src="res/icon/baidu-color.svg" alt="Baidu" class="search-engine-img"></a>
                    <a id="google-search" draggable="true" target="_blank" class="search-engine-icon" onclick="searchWithEngine('google')" aria-label="使用Google搜索"><img src="res/icon/google-color.svg" alt="Google" class="search-engine-img"></a>
                </div>
            </div>
        </div>
    </div>

    <!-- 导航容器 -->
    <div class="navigation-container">
        <button id="theme-toggle" class="navigation-icon" aria-label="切换主题" title="切换主题"><span class="light-icon">🌞</span><span class="dark-icon">🌙</span></button>
        <button id="page-toggle" class="navigation-icon" title="文章列表" data-page="home" aria-label="查看文章列表"><i class="fas fa-newspaper"></i></button>
    </div>

    <!-- 文章列表页面 -->
    <div class="page" id="article-page" aria-live="polite">
        <div id="nav-container">
            <nav class="nav-bar" aria-label="文章列表导航">
                <button id="back-home" class="back-home-button" aria-label="返回首页">← 首页</button>
                <div class="nav-links">
                    <a href="admin.html" class="admin-link">Admin</a>
                </div>
            </nav>
        </div>
        <header class="article-header">
            <div class="controls" role="search">
                <select id="tag" aria-label="按标签筛选文章"></select>
                <input id="q" type="text" placeholder="搜索标题/标签/摘要" aria-label="搜索文章">
            </div>
        </header>
        <main class="article-list-main">
            <ul id="post-list" aria-label="文章列表"></ul>
            <div class="controls pagination-controls">
                <button id="prev" aria-label="上一页">上一页</button>
                <div id="pagination" class="meta" aria-live="polite"></div>
                <button id="next" aria-label="下一页">下一页</button>
            </div>
        </main>
    </div>
    <script src="res/js/index.js" defer></script>
    <!-- 预加载关键资源 -->
    <link rel="preload" href="res/icon/bing-color.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="res/icon/baidu-color.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="res/icon/google-color.svg" as="image" type="image/svg+xml">
</body>

</html>
