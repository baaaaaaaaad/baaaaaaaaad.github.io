<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="baaaaaaaaad的个人博客，分享技术文章和生活感悟">
    <meta name="keywords" content="博客,技术,生活,感悟">
    <meta name="author" content="baaaaaaaaad">
    <title>baaaaaaaaad(9A认证)</title>
    <link rel="icon" href="res/icon/rainbow.png" type="image/png">
    <link rel="stylesheet" href="res/css/index.css">
</head>

<body class="dark-mode">
    <div class="background-fallback" aria-hidden="true"></div>
    <video id="rain-background" muted playsinline loop preload="auto" aria-hidden="true" tabindex="-1"></video>

    <div class="slide-stage" id="slide-stage" data-view="home">
    <main class="content-container page" id="main-page" tabindex="-1">
        <h1 class="sr-only">baaaaaaaaad(9A认证)</h1>
        <!-- 时钟 -->
        <div class="clock" id="clock" role="img" aria-label="当前时间" aria-live="off"></div>
        <!-- 日期与今日进度 -->
        <div class="date-block">
            <div class="date" id="date"></div>
            <div class="day-progress" id="day-progress" role="progressbar" aria-label="今日进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="day-progress-track">
                    <div class="day-progress-fill" id="day-progress-fill"></div>
                </div>
                <span class="day-progress-text" id="day-progress-text">今日 0%</span>
            </div>
        </div>
    </main>
    <section class="page search-page" id="search-page" aria-label="搜索" tabindex="-1" inert aria-hidden="true">
        <button class="back-home-button" data-slide="home">← 首页</button>
        <div class="search-container" id="search-container">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="搜索..." class="search-input">
                <div class="search-engines" id="searchEnginesContainer" role="group" aria-label="搜索引擎选择">
                    <a id="bing-search" role="button" tabindex="0" draggable="true" target="_blank" class="search-engine-icon" aria-label="使用Bing搜索"><img src="res/icon/bing-color.svg" alt="Bing" class="search-engine-img"></a>
                    <a id="baidu-search" role="button" tabindex="0" draggable="true" target="_blank" class="search-engine-icon" aria-label="使用百度搜索"><img src="res/icon/baidu-color.svg" alt="Baidu" class="search-engine-img"></a>
                    <a id="google-search" role="button" tabindex="0" draggable="true" target="_blank" class="search-engine-icon" aria-label="使用Google搜索"><img src="res/icon/google-color.svg" alt="Google" class="search-engine-img"></a>
                </div>
            </div>
        </div>
    </section>

    <nav class="slide-navigation" aria-label="页面导航">
        <button type="button" id="admin-toggle" aria-label="向左进入管理页">←</button>
        <button type="button" id="fullscreen-toggle" aria-label="进入全屏" aria-pressed="false">↑</button>
        <button type="button" data-slide="article" aria-controls="article-page">↓</button>
        <button type="button" data-slide="search" aria-controls="search-page">→</button>
    </nav>

    <div class="page" id="article-page" tabindex="-1" inert aria-hidden="true">
        <div id="nav-container">
            <nav class="nav-bar" aria-label="文章列表导航">
                <button id="back-home" class="back-home-button" aria-label="返回首页">← 首页</button>
                <div class="nav-links">
                    <a href="admin.html" class="admin-link">Admin</a>
                </div>
            </nav>
        </div>
        <header class="article-header">
            <div class="controls" role="search">
                <select id="tag" aria-label="按标签筛选文章"></select>
                <input id="q" type="text" placeholder="搜索标题/标签/摘要" aria-label="搜索文章">
            </div>
        </header>
        <section class="article-list-main" aria-label="文章列表">
            <ul id="post-list" aria-label="文章列表"></ul>
            <div class="controls pagination-controls">
                <button id="prev" aria-label="上一页">上一页</button>
                <div id="pagination" class="meta" aria-live="polite"></div>
                <button id="next" aria-label="下一页">下一页</button>
            </div>
        </section>
    </div>
    </div>
    <script type="module" src="res/js/index.js"></script>
    <!-- 预加载关键资源 -->
    <link rel="preload" href="res/icon/bing-color.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="res/icon/baidu-color.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="res/icon/google-color.svg" as="image" type="image/svg+xml">
    <script src="res/js/sw-register.js" defer></script>
</body>

</html>
