<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>baaaaaaaaad(9A认证)</title>
    <link rel="icon" href="res/icon/capitalism.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局样式和主题变量 */
        :root {
            /* 亮色主题 */
            --bg-color: #ffffff;
            --text-color: #333333;
            --secondary-text: #666666;
            --border-color: #e0e0e0;
            --accent-color: #4a90e2;
            --hover-color: #357abd;
            --shadow-light: rgba(0, 0, 0, 0.1);
            --shadow-medium: rgba(0, 0, 0, 0.2);
            --card-bg: #ffffff;
            --search-bg: #f5f5f5;

            /* 暗色主题 */
            --dark-bg-color: #1a1a1a;
            --dark-text-color: #ffffff;
            --dark-secondary-text: #aaaaaa;
            --dark-border-color: #333333;
            --dark-accent-color: #5fa3e4;
            --dark-hover-color: #4a88c2;
            --dark-shadow-light: rgba(255, 255, 255, 0.05);
            --dark-shadow-medium: rgba(255, 255, 255, 0.1);
            --dark-card-bg: #2a2a2a;
            --dark-search-bg: #333333;
        }

        /* 基础布局 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        /* 时钟样式 */
        .clock {
            font-family: 'Courier New', monospace;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: bold;
            color: var(--text-color);
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px var(--shadow-light);
        }

        /* 搜索区域 */
        .search-container {
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--search-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 12px 20px;
            width: 100%;
            box-shadow: 0 2px 10px var(--shadow-light);
            transition: all 0.3s ease;
        }

        .search-bar:hover {
            box-shadow: 0 4px 15px var(--shadow-medium);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 8px 15px;
            font-size: 16px;
            color: var(--text-color);
        }

        .search-engines {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 40px;
        }

        /* 搜索引擎图标样式 */
        .search-engine-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            margin-left: 5px;
            cursor: move;
            transition: all 0.3s ease;
            background: transparent;
            box-shadow: none;
            border: none;
        }

        .search-engine-icon:hover {
            transform: scale(1.1);
            background: transparent;
            box-shadow: 0 4px 10px var(--shadow-medium);
        }

        .search-engine-icon img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .search-engine-icon.dragging {
            opacity: 0.5;
            transform: scale(1.2);
        }

        .search-engine-icon.drag-over {
            border: 2px dashed var(--accent-color);
        }

        /* 字符动画 */
        .char {
            display: inline-block;
            transform-origin: bottom center;
        }

        @keyframes jump-small {
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes jump-medium {
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes jump-large {
            50% {
                transform: translateY(-30px);
            }
        }

        .char-jump-small,
        .char-jump-medium,
        .char-jump-large {
            animation-duration: 0.5s;
            animation-timing-function: ease-in-out;
        }

        .char-jump-small {
            animation-name: jump-small;
        }

        .char-jump-medium {
            animation-name: jump-medium;
        }

        .char-jump-large {
            animation-name: jump-large;
        }

        /* 导航容器 */
        .navigation-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 导航图标样式 */
        .navigation-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px var(--shadow-light);
        }

        .navigation-icon:hover {
            transform: scale(1.1);
            background: var(--accent-color);
            color: white;
            box-shadow: 0 4px 15px var(--shadow-medium);
        }

        /* 页面切换样式 */
        #article-page {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 60px 20px 20px;
            animation: fadeIn 0.5s ease-in-out;
            background: var(--bg-color);
        }

        #main-page {
            animation: fadeIn 0.5s ease-in-out;
        }

        /* 页面切换动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes flipIn {
            from {
                opacity: 0;
                transform: perspective(400px) rotateY(90deg);
            }

            to {
                opacity: 1;
                transform: perspective(400px) rotateY(0deg);
            }
        }

        /* 按钮动画 */
        .navigation-icon {
            transition: all 0.3s ease;
        }

        .navigation-icon:hover {
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .navigation-icon.clicked {
            animation: bounceIn 0.5s ease-in-out;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.3);
                opacity: 1;
            }

            70% {
                transform: scale(0.9);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .page-transition .navigation-icon {
            animation: slideOut 0.3s ease-in-out;
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(50px);
            }
        }

        /* 暗色主题 */
        body.dark-mode {
            --bg-color: var(--dark-bg-color);
            --text-color: var(--dark-text-color);
            --secondary-text: var(--dark-secondary-text);
            --border-color: var(--dark-border-color);
            --accent-color: var(--dark-accent-color);
            --hover-color: var(--dark-hover-color);
            --shadow-light: var(--dark-shadow-light);
            --shadow-medium: var(--dark-shadow-medium);
            --card-bg: var(--dark-card-bg);
            --search-bg: var(--dark-search-bg);
        }

        /* 主题切换图标 */
        .light-icon,
        .dark-icon {
            font-size: 20px;
        }

        body.dark-mode .light-icon,
        body:not(.dark-mode) .dark-icon {
            display: none;
        }

        /* 文章列表页面样式 */
        #article-page {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        #nav-container {
            margin-bottom: 30px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
        }

        #back-home {
            display: flex;
            align-items: center;
            gap: 5px;
            border: none;
            background: none;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        #back-home:hover {
            background: var(--search-bg);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        #tag,
        #q {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            background: var(--search-bg);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        #tag:focus,
        #q:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px var(--shadow-light);
        }

        #q {
            flex: 1;
            min-width: 200px;
        }

        /* 文章列表样式 */
        #post-list {
            list-style: none;
            padding: 0;
            margin: 0 0 30px;
        }

        #post-list li {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px var(--shadow-light);
        }

        #post-list li:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--shadow-medium);
        }

        #post-list a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }

        #post-list a:hover {
            color: var(--hover-color);
            text-decoration: underline;
        }

        #post-list .meta {
            color: var(--secondary-text);
            font-size: 0.875rem;
            margin-bottom: 10px;
        }

        #post-list .summary {
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0;
        }

        /* 分页控制 */
        #prev,
        #next {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        #prev:hover,
        #next:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        #prev:disabled,
        #next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--search-bg);
            color: var(--secondary-text);
            border-color: var(--border-color);
        }

        #pagination {
            color: var(--secondary-text);
            font-size: 14px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .clock {
                font-size: clamp(2rem, 8vw, 4rem);
            }

            .search-container {
                width: 95%;
            }

            .search-bar {
                padding: 8px 15px;
            }

            .search-input {
                font-size: 14px;
            }

            .search-engine-icon {
                width: 36px;
                height: 36px;
            }

            .navigation-container {
                top: 10px;
                right: 10px;
            }

            .navigation-icon {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }

            #article-page {
                padding: 50px 15px 15px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            #q {
                min-width: auto;
            }
        }

        /* 错误提示样式 */
        .error {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="content-container" id="main-page">
        <div class="clock" id="clock"></div>
        <div class="search-container">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="搜索..." class="search-input">
                <div class="search-engines" id="searchEnginesContainer">
                    <a id="bing-search" draggable="true" target="_blank" class="search-engine-icon" onclick="searchWithEngine('bing')"><img src="res/icon/bing-color.svg" alt="Bing" style="width: 36px; height: 36px;"></a>
                    <a id="baidu-search" draggable="true" target="_blank" class="search-engine-icon" onclick="searchWithEngine('baidu')"><img src="res/icon/baidu-color.svg" alt="Baidu" style="width: 36px; height: 36px;"></a>
                    <a id="google-search" draggable="true" target="_blank" class="search-engine-icon" onclick="searchWithEngine('google')"><img src="res/icon/google-color.svg" alt="Google" style="width: 36px; height: 36px;"></a>
                </div>
            </div>
        </div>
    </div>

    <!-- 导航容器 -->
    <div class="navigation-container">
        <button id="theme-toggle" class="navigation-icon"><i class="fas fa-sun light-icon"></i><i class="fas fa-moon dark-icon"></i></button>
        <button id="page-toggle" class="navigation-icon" title="文章列表" data-page="home"><i class="fas fa-newspaper"></i></button>
    </div>

    <!-- 文章列表页面 -->
    <div id="article-page">
        <div id="nav-container">
            <div class="nav-bar">
                <button id="back-home" style="border: none; background: none; font-weight: bold; font-size: 16px; cursor: pointer;">← 首页</button>
                <div class="nav-links">
                    <a href="admin.html" style="display: none;">Admin</a>
                </div>
            </div>
        </div>
        <header>
            <div class="controls">
                <select id="tag"></select>
                <input id="q" type="text" placeholder="搜索标题/标签/摘要">
            </div>
        </header>
        <main>
            <ul id="post-list"></ul>
            <div class="controls">
                <button id="prev">上一页</button>
                <div id="pagination" class="meta"></div>
                <button id="next">下一页</button>
            </div>
        </main>
    </div>
    <script>
        /**
         * 设置主题切换功能
         * 实现亮色/暗色主题的切换并记住用户偏好
         */
        function setupThemeToggle() {
            const toggleButton = document.getElementById('theme-toggle');
            const body = document.body;

            // 初始化主题：优先使用本地存储的主题偏好，否则根据系统设置
            if (localStorage.getItem('theme') === 'dark' ||
                (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                body.classList.add('dark-mode');
            }

            // 添加主题切换按钮点击事件
            toggleButton.addEventListener('click', () => {
                // 切换body的dark-mode类
                body.classList.toggle('dark-mode');

                // 将主题偏好保存到本地存储
                if (body.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                } else {
                    localStorage.setItem('theme', 'light');
                }
            });
        }

        setupThemeToggle();

        // 页面切换功能
        document.addEventListener('DOMContentLoaded', function () {
            const mainPage = document.getElementById('main-page');
            const articlePage = document.getElementById('article-page');
            const pageToggleBtn = document.getElementById('page-toggle');
            const backHomeBtn = document.getElementById('back-home');
            const navigationContainer = document.querySelector('.navigation-container');
            const navigationIcons = document.querySelectorAll('.navigation-icon');

            // 添加按钮点击动画
            navigationIcons.forEach(icon => {
                icon.addEventListener('click', function () {
                    // 移除之前的点击类
                    this.classList.remove('clicked');
                    // 触发重排
                    void this.offsetWidth;
                    // 添加点击类
                    this.classList.add('clicked');

                    // 点击后移除点击类
                    setTimeout(() => {
                        this.classList.remove('clicked');
                    }, 500);
                });
            });

            // 页面切换函数
            function togglePage() {
                const currentPage = pageToggleBtn.getAttribute('data-page');

                if (currentPage === 'home') {
                    // 从主页切换到文章列表
                    // 添加页面切换类
                    navigationContainer.classList.add('page-transition');

                    // 使用不同的动画效果
                    const animations = ['fadeIn', 'slideInLeft', 'scaleIn', 'flipIn'];
                    const randomAnimation = animations[Math.floor(Math.random() * animations.length)];

                    // 隐藏主页面
                    mainPage.style.animation = 'fadeOut 0.3s ease-in-out forwards';

                    setTimeout(() => {
                        mainPage.style.display = 'none';
                        mainPage.style.animation = '';

                        // 显示文章列表页面
                        articlePage.style.display = 'block';
                        articlePage.style.animation = `${randomAnimation} 0.5s ease-in-out forwards`;

                        // 移除页面切换类
                        navigationContainer.classList.remove('page-transition');

                        // 初始化文章列表
                        initArticleList();

                        // 更新按钮为返回主页按钮
                        pageToggleBtn.setAttribute('data-page', 'article');
                        pageToggleBtn.setAttribute('title', '主页');
                        pageToggleBtn.innerHTML = '<i class="fas fa-home"></i>';
                    }, 300);
                } else {
                    // 从文章列表返回主页
                    // 使用不同的动画效果
                    const animations = ['fadeIn', 'slideInRight', 'scaleIn', 'flipIn'];
                    const randomAnimation = animations[Math.floor(Math.random() * animations.length)];

                    // 隐藏文章列表页面
                    articlePage.style.animation = 'fadeOut 0.3s ease-in-out forwards';

                    setTimeout(() => {
                        articlePage.style.display = 'none';
                        articlePage.style.animation = '';

                        // 显示主页面
                        mainPage.style.display = 'flex';
                        mainPage.style.animation = `${randomAnimation} 0.5s ease-in-out forwards`;

                        // 更新按钮为文章列表按钮
                        pageToggleBtn.setAttribute('data-page', 'home');
                        pageToggleBtn.setAttribute('title', '文章列表');
                        pageToggleBtn.innerHTML = '<i class="fas fa-newspaper"></i>';
                    }, 300);
                }
            }

            // 绑定页面切换按钮事件
            pageToggleBtn.addEventListener('click', togglePage);

            // 文章列表页面的返回按钮也触发页面切换
            backHomeBtn.addEventListener('click', togglePage);
        });
    </script>
    <script>
        /**
         * 页面主脚本文件
         * 功能包括：时钟显示与动画、主题切换、搜索框功能、搜索引擎图标拖拽排序
         */

        // 存储上一次的时间字符串，用于比较时间是否变化
        let prevTimeStr = '';

        /**
         * 实时更新时间并拆分字符进行动画处理
         * 将时间字符串拆分为单个字符，对变化的字符应用动画效果
         */
        function updateClock() {
            const now = new Date();
            // 格式化时间为 HH:MM:SS 格式
            const hours = String(now.getHours()).padStart(2, '0');  // 小时补零
            const minutes = String(now.getMinutes()).padStart(2, '0');  // 分钟补零
            const seconds = String(now.getSeconds()).padStart(2, '0');  // 秒钟补零
            const timeStr = `${hours}:${minutes}:${seconds}`;

            // 获取时钟显示元素
            const clockEl = document.getElementById('clock');

            // 如果是首次加载（prevTimeStr为空），初始渲染所有字符
            if (prevTimeStr === '') {
                // 将时间字符串拆分为单个字符并渲染为带span标签的HTML
                clockEl.innerHTML = timeStr.split('').map((char, index) =>
                    `<span class="char char-static">${char}</span>`
                ).join('');
            }
            // 如果时间发生变化，只更新变化的字符
            else if (timeStr !== prevTimeStr) {
                // 分割上一次和当前的时间字符串为字符数组
                const prevChars = prevTimeStr.split('');
                const currentChars = timeStr.split('');
                // 获取所有时钟字符元素
                const clockChars = clockEl.querySelectorAll('.char');

                // 遍历当前时间的每个字符
                currentChars.forEach((char, index) => {
                    // 如果字符变化且不是冒号位置（2和5是冒号位置）
                    if (char !== prevChars[index] && index !== 2 && index !== 5) {
                        // 移除之前可能存在的动画类
                        clockChars[index].classList.remove('char-jump-small', 'char-jump-medium', 'char-jump-large');
                        // 为不同位置的字符应用不同高度的弹跳动画
                        const animationType = ['char-jump-small', 'char-jump-medium', 'char-jump-large'][index % 3];
                        clockChars[index].classList.add(animationType);
                        // 更新字符内容
                        clockChars[index].textContent = char;

                        // 动画结束后移除动画类，防止重复触发
                        clockChars[index].addEventListener('animationend', function handler() {
                            this.classList.remove(animationType);
                            this.removeEventListener('animationend', handler);
                        });
                    }
                    // 冒号位置的处理（不需要动画）
                    else if (index === 2 || index === 5) {
                        clockChars[index].textContent = char;
                    }
                });
            }

            // 更新上一次时间记录
            prevTimeStr = timeStr;
        }

        /**
         * 初始化时钟
         * 首次更新并设置定时器每秒更新一次
         */
        function initClock() {
            updateClock();  // 立即更新一次
            setInterval(updateClock, 1000);  // 设置每秒更新
        }


        /**
         * 设置搜索引擎图标拖拽排序功能
         * 允许用户拖动调整搜索引擎图标的顺序并保存
         */
        function setupDragAndDrop() {
            const container = document.getElementById('searchEnginesContainer');
            const items = container.querySelectorAll('.search-engine-icon');
            let draggedItem = null; // 跟踪当前正在拖拽的元素

            // 加载保存的排序顺序
            const savedOrder = localStorage.getItem('searchEngineOrder');
            if (savedOrder) {
                const order = savedOrder.split(',');
                // 按照保存的顺序重新排列元素
                order.forEach(id => {
                    const item = document.getElementById(id);
                    if (item) container.appendChild(item);
                });
            }

            // 为每个可拖拽元素添加事件监听器
            items.forEach(item => {
                // 开始拖拽时触发
                item.addEventListener('dragstart', function (e) {
                    // 搜索框有内容时禁用拖拽
                    const searchInput = document.getElementById('search-input');
                    if (searchInput && searchInput.value.trim() !== '') {
                        e.preventDefault();
                        return;
                    }

                    draggedItem = this; // 记录正在拖拽的元素
                    // 使用setTimeout确保样式应用在拖拽开始后
                    setTimeout(() => this.classList.add('dragging'), 0);
                    // 设置拖拽数据
                    e.dataTransfer.setData('text/plain', this.id);
                });

                // 结束拖拽时触发
                item.addEventListener('dragend', function () {
                    // 移除拖拽相关样式
                    this.classList.remove('dragging');
                    draggedItem = null;
                    // 移除所有元素的drag-over样式
                    container.querySelectorAll('.search-engine-icon').forEach(el => {
                        el.classList.remove('drag-over');
                    });

                    // 保存新的排序顺序到本地存储
                    const order = Array.from(container.querySelectorAll('.search-engine-icon'))
                        .map(item => item.id); // 提取所有图标的ID
                    localStorage.setItem('searchEngineOrder', order.join(','));
                });

                // 拖拽经过元素时触发
                item.addEventListener('dragover', function (e) {
                    e.preventDefault(); // 允许放置
                    this.classList.add('drag-over'); // 添加拖拽经过样式

                    // 如果拖拽的不是当前元素本身
                    if (draggedItem !== this) {
                        const rect = this.getBoundingClientRect(); // 获取元素位置和尺寸
                        const nextSibling = this.nextElementSibling;
                        // 判断拖拽元素是在当前元素之前还是之后
                        const isDraggedAfter = draggedItem.compareDocumentPosition(this) & Node.DOCUMENT_POSITION_PRECEDING;
                        // 计算鼠标在当前元素内的X坐标
                        const mouseX = e.clientX - rect.left;

                        // 根据鼠标位置和相对位置决定插入位置
                        // 如果鼠标在左半部分且拖拽元素在当前元素之后，则插入到当前元素之前
                        if (mouseX < rect.width / 2 && isDraggedAfter) {
                            container.insertBefore(draggedItem, this);
                        }
                        // 如果鼠标在右半部分且拖拽元素在当前元素之前，则插入到下一个元素之前
                        else if (mouseX >= rect.width / 2 && !isDraggedAfter) {
                            container.insertBefore(draggedItem, nextSibling);
                        }
                    }
                });

                // 拖拽离开元素时触发
                item.addEventListener('dragleave', function () {
                    this.classList.remove('drag-over'); // 移除拖拽经过样式
                });

                // 在元素上放置时触发
                item.addEventListener('drop', function (e) {
                    e.preventDefault(); // 阻止默认行为
                    this.classList.remove('drag-over'); // 移除拖拽经过样式
                });
            });
        }

        /**
         * 使用指定的搜索引擎进行搜索
         * @param {string} engine - 搜索引擎名称（google/bing/baidu）
         */
        function searchWithEngine(engine) {
            const searchInput = document.querySelector('.search-input');
            // 选中搜索框文字，使用setTimeout确保元素可交互
            setTimeout(() => searchInput.select(), 0);
            // 编码搜索查询字符串
            const query = encodeURIComponent(searchInput.value.trim());

            if (!query) return; // 不执行空搜索

            // 根据搜索引擎构建搜索URL
            let url = '';
            switch (engine) {
                case 'google':
                    url = `https://www.google.com/search?q=${query}`;
                    break;
                case 'bing':
                    url = `https://www.bing.com/search?q=${query}`;
                    break;
                case 'baidu':
                    url = `https://www.baidu.com/s?wd=${query}`;
                    break;
            }

            // 在新标签页打开搜索结果
            window.open(url, '_blank');
        }

        /**
         * 初始化函数
         * 启动所有页面功能模块
         */
        function init() {
            // 初始化时钟显示
            initClock();

            // 初始化拖拽排序功能
            setupDragAndDrop();

            // 添加搜索框回车事件监听 - 按回车时使用第一个搜索引擎搜索
            document.getElementById('search-input').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const firstEngine = document.querySelector('#searchEnginesContainer .search-engine-icon');
                    if (firstEngine) {
                        // 从元素ID中提取搜索引擎名称
                        const engineName = firstEngine.id.split('-')[0];
                        searchWithEngine(engineName);
                    }
                }
            });

            // 添加搜索框输入监听 - 根据是否有输入内容切换搜索图标光标样式
            document.getElementById('search-input').addEventListener('input', function () {
                const searchIcons = document.querySelectorAll('.search-engine-icon');
                const hasText = this.value.trim() !== '';

                // 有内容时显示手型光标，否则使用默认光标
                searchIcons.forEach(icon => {
                    icon.style.cursor = hasText ? 'pointer' : '';
                });
            });
        }

        // 页面加载完成后初始化所有功能
        document.addEventListener('DOMContentLoaded', init);
    </script>

    <!-- 文章列表功能 -->
    <script>
        // 配置信息（从 config.js 复制）
        const CONFIG = {
            SITE_TITLE: 'My Gist Blog',
            SITE_DESC: '博客由 Gist 驱动',
            PAGE_SIZE: 10,
            GIST_ID: 'your-gist-id-here' // 请替换为你的 Gist ID
        };

        // 文章列表页面状态（内存中即可）
        const articleState = {
            all: [],        // 所有文章（来自 index.json）
            filtered: [],   // 经过标签/搜索过滤后的文章
            tag: 'all',     // 当前筛选标签
            q: '',          // 当前搜索关键词（简单包含匹配）
            page: 1         // 当前页码（从 1 开始）
        };

        /** 渲染可视页的文章列表与分页信息 */
        function renderArticleList() {
            const start = (articleState.page - 1) * CONFIG.PAGE_SIZE;
            const end = start + CONFIG.PAGE_SIZE;
            const pageItems = articleState.filtered.slice(start, end);

            const ul = document.querySelector('#post-list');
            if (ul) {
                ul.innerHTML = '';

                for (const p of pageItems) {
                    const li = document.createElement('li');
                    li.innerHTML = `
                <a href="post.html?slug=${encodeURIComponent(p.slug)}">${p.title}</a>
                <span class="meta">${new Date(p.created_at).toLocaleDateString()} · ${p.tags?.join(', ') || ''}</span>
                <p class="summary">${p.summary || ''}</p>
              `;
                    ul.appendChild(li);
                }
            }

            const totalPages = Math.max(1, Math.ceil(articleState.filtered.length / CONFIG.PAGE_SIZE));
            const paginationEl = document.querySelector('#pagination');
            if (paginationEl) {
                paginationEl.textContent = `第 ${articleState.page}/${totalPages} 页`;
            }
        }

        /** 根据所有文章数据重建标签下拉框 */
        function rebuildFilters() {
            const tagSet = new Set(['all']);
            articleState.all.forEach(p => (p.tags || []).forEach(t => tagSet.add(t)));

            const sel = document.querySelector('#tag');
            if (sel) {
                sel.innerHTML = '';
                for (const t of [...tagSet]) {
                    const opt = document.createElement('option');
                    opt.value = t; opt.textContent = t;
                    sel.appendChild(opt);
                }
            }
        }

        /** 应用当前筛选条件（标签 + 关键词），并按创建时间倒序排序 */
        function applyFilter() {
            const { tag, q } = articleState;
            articleState.filtered = articleState.all.filter(p => {
                if (p.status !== 'published') return false; // 仅展示已发布
                const okTag = tag === 'all' || (p.tags || []).includes(tag);
                const text = `${p.title} ${p.summary} ${(p.tags || []).join(' ')}`.toLowerCase();
                const okQ = !q || text.includes(q.toLowerCase());
                return okTag && okQ;
            }).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            articleState.page = 1;
            renderArticleList();
        }

        /** 初始化文章列表 */
        async function initArticleList() {
            // 基本站点信息
            document.title = `${CONFIG.SITE_TITLE}`;
            const siteTitleEl = document.querySelector('#site-title');
            if (siteTitleEl) {
                siteTitleEl.textContent = CONFIG.SITE_TITLE;
            }
            const siteDescEl = document.querySelector('#site-desc');
            if (siteDescEl) {
                siteDescEl.textContent = CONFIG.SITE_DESC;
            }

            // 拉取索引并渲染
            try {
                // 使用 mock 数据测试
                const mockIndex = {
                    posts: [
                        {
                            "title": "Hello World",
                            "slug": "hello-world",
                            "filename": "2025-01-01--hello-world.md",
                            "tags": ["introduction", "blog"],
                            "summary": "这是我的第一篇博客文章",
                            "status": "published",
                            "created_at": "2025-01-01T00:00:00Z",
                            "updated_at": "2025-01-01T00:00:00Z"
                        },
                        {
                            "title": "测试文章 2",
                            "slug": "test-post-2",
                            "filename": "2025-01-02--test-post-2.md",
                            "tags": ["test", "example"],
                            "summary": "这是第二篇测试文章",
                            "status": "published",
                            "created_at": "2025-01-02T00:00:00Z",
                            "updated_at": "2025-01-02T00:00:00Z"
                        },
                        {
                            "title": "关于这个博客",
                            "slug": "about-this-blog",
                            "filename": "2025-01-03--about-this-blog.md",
                            "tags": ["about", "blog"],
                            "summary": "关于这个基于 Gist 的博客的介绍",
                            "status": "published",
                            "created_at": "2025-01-03T00:00:00Z",
                            "updated_at": "2025-01-03T00:00:00Z"
                        }
                    ]
                };

                articleState.all = mockIndex.posts || [];
                rebuildFilters();
                applyFilter();

                // 绑定交互
                const tagEl = document.querySelector('#tag');
                if (tagEl) {
                    tagEl.addEventListener('change', e => {
                        articleState.tag = e.target.value; applyFilter();
                    });
                }

                const qEl = document.querySelector('#q');
                if (qEl) {
                    qEl.addEventListener('input', e => {
                        articleState.q = e.target.value; applyFilter();
                    });
                }

                const prevEl = document.querySelector('#prev');
                if (prevEl) {
                    prevEl.addEventListener('click', () => {
                        if (articleState.page > 1) { articleState.page--; renderArticleList(); }
                    });
                }

                const nextEl = document.querySelector('#next');
                if (nextEl) {
                    nextEl.addEventListener('click', () => {
                        const totalPages = Math.max(1, Math.ceil(articleState.filtered.length / CONFIG.PAGE_SIZE));
                        if (articleState.page < totalPages) { articleState.page++; renderArticleList(); }
                    });
                }
            } catch (err) {
                console.error(err);
                const postListEl = document.querySelector('#post-list');
                if (postListEl) {
                    postListEl.innerHTML = `<li class="error">加载失败：${err.message}</li>`;
                }
            }
        }
    </script>
