<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="baaaaaaaaad的个人博客，分享技术文章和生活感悟">
    <meta name="keywords" content="博客,技术,生活,感悟">
    <meta name="author" content="baaaaaaaaad">
    <title>baaaaaaaaad(9A认证)</title>
    <link rel="icon" href="res/icon/rainbow.png" type="image/png">
    <link rel="stylesheet" href="res/css/index.css">
</head>

<body>
    <!-- 主页内容容器 -->
    <main class="content-container page" id="main-page">
        <h1 class="sr-only">baaaaaaaaad(9A认证)</h1>
        <!-- 时钟 -->
        <div class="clock" id="clock"></div>
        <!-- 日期与今日进度 -->
        <div class="date-block">
            <div class="date" id="date"></div>
            <div class="day-progress" id="day-progress" role="progressbar" aria-label="今日进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="day-progress-track">
                    <div class="day-progress-fill" id="day-progress-fill"></div>
                </div>
                <span class="day-progress-text" id="day-progress-text">今日 0%</span>
            </div>
        </div>
        <!-- 搜索框 -->
        <div class="search-container" id="search-container">
            <div class="search-bar">
                <span class="search-leading" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
                        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
                        <path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="搜索..." class="search-input">
                <button type="button" id="search-clear" class="search-clear" aria-label="清空搜索" title="清空搜索" hidden>
                    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
                        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                </button>
                <div class="search-engines" id="searchEnginesContainer" role="group" aria-label="搜索引擎选择">
                    <a id="bing-search" draggable="true" target="_blank" class="search-engine-icon" aria-label="使用Bing搜索"><img src="res/icon/bing-color.svg" alt="Bing" class="search-engine-img"></a>
                    <a id="baidu-search" draggable="true" target="_blank" class="search-engine-icon" aria-label="使用百度搜索"><img src="res/icon/baidu-color.svg" alt="Baidu" class="search-engine-img"></a>
                    <a id="google-search" draggable="true" target="_blank" class="search-engine-icon" aria-label="使用Google搜索"><img src="res/icon/google-color.svg" alt="Google" class="search-engine-img"></a>
                </div>
            </div>
        </div>
    </main>

    <!-- 导航容器 -->
    <div class="navigation-container">
        <button id="theme-toggle" class="navigation-icon" aria-label="切换主题" aria-pressed="false" aria-expanded="false" aria-controls="search-container page-toggle" aria-keyshortcuts="Shift+T" title="单击切换主题，双击或 Shift+T 显示/隐藏搜索和列表按钮"><span class="light-icon">🌞</span><span class="dark-icon">🌙</span></button>
        <button id="page-toggle" class="navigation-icon" title="文章列表" data-page="home" aria-label="查看文章列表">
            <svg class="navigation-svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1 2v10h14V7H5Zm2 2h4v2H7V9Zm0 4h6v2H7v-2Zm8-4h2v2h-2V9Zm0 4h2v2h-2v-2Z"/>
            </svg>
        </button>
    </div>

    <!-- 文章列表页面 -->
    <div class="page" id="article-page" aria-live="polite">
        <div id="nav-container">
            <nav class="nav-bar" aria-label="文章列表导航">
                <button id="back-home" class="back-home-button" aria-label="返回首页">← 首页</button>
                <div class="nav-links">
                    <a href="admin.html" class="admin-link">Admin</a>
                </div>
            </nav>
        </div>
        <header class="article-header">
            <div class="controls" role="search">
                <select id="tag" aria-label="按标签筛选文章"></select>
                <input id="q" type="text" placeholder="搜索标题/标签/摘要" aria-label="搜索文章">
            </div>
        </header>
        <section class="article-list-main" aria-label="文章列表">
            <ul id="post-list" aria-label="文章列表"></ul>
            <div class="controls pagination-controls">
                <button id="prev" aria-label="上一页">上一页</button>
                <div id="pagination" class="meta" aria-live="polite"></div>
                <button id="next" aria-label="下一页">下一页</button>
            </div>
        </section>
    </div>
    <script type="module" src="res/js/index.js"></script>
    <!-- 预加载关键资源 -->
    <link rel="preload" href="res/icon/bing-color.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="res/icon/baidu-color.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="res/icon/google-color.svg" as="image" type="image/svg+xml">
</body>

</html>
