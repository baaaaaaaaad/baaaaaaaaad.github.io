<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="文章列表：标签筛选、站内搜索与分页">
    <title>文章 · baaaaaaaad</title>
    <link rel="icon" href="res/icon/rainbow.png" type="image/png">
    <link rel="stylesheet" href="res/css/index.css">
</head>

<body class="dark-mode posts-page">
    <div class="navigation-container">
        <button id="theme-toggle" class="navigation-icon" aria-label="切换主题" aria-pressed="false" title="单击切换主题"><span class="light-icon">🌞</span><span class="dark-icon">🌙</span></button>
        <a href="index.html" class="navigation-icon" aria-label="返回首页" title="首页">
            <svg class="navigation-svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M12 3.2 2.8 11h2.4v9h5v-5.6h3.6V20h5v-9h2.4L12 3.2Z"/>
            </svg>
        </a>
        <a href="search.html" class="navigation-icon" aria-label="打开搜索页" title="搜索">
            <svg class="navigation-svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
                <path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            </svg>
        </a>
    </div>

    <main id="article-page" aria-live="polite">
        <h1 class="sr-only">文章列表</h1>
        <header class="article-header">
            <div class="controls" role="search">
                <select id="tag" aria-label="按标签筛选文章"></select>
                <input id="q" type="text" placeholder="搜索标题/标签/摘要" aria-label="搜索文章">
            </div>
        </header>
        <section class="article-list-main" aria-label="文章列表">
            <ul id="post-list" aria-label="文章列表"></ul>
            <div class="controls pagination-controls">
                <button id="prev" aria-label="上一页">上一页</button>
                <div id="pagination" class="meta" aria-live="polite"></div>
                <button id="next" aria-label="下一页">下一页</button>
            </div>
        </section>
    </main>

    <script type="module" src="res/js/posts.js"></script>
    <script src="res/js/sw-register.js" defer></script>
</body>

</html>
