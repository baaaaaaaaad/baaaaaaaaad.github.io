<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="管理后台 - 新建、编辑、删除文章">
  <title>管理 · baaaaaaaad</title>
  <link rel="icon" href="res/icon/rainbow.png" type="image/png">
  <link rel="stylesheet" href="res/css/index.css">
</head>
<body class="admin-page dark-mode">
<header class="admin-header">
  <h1>文章管理</h1>
  <p>管理 Gist 中的文章与发布状态</p>
  <section class="admin-panel" aria-labelledby="pat-heading">
    <div class="admin-panel-heading">
      <div>
        <h2 id="pat-heading">凭据设置</h2>
        <p class="meta">仅在本地使用 PAT 写入 Gist</p>
      </div>
    </div>
    <div class="controls pat-controls">
      <div class="pat-input-wrapper">
        <input id="pat" type="password" aria-label="Personal Access Token" placeholder="输入 PAT（仅 gist 权限）" autocomplete="off" spellcheck="false">
        <button id="pat-toggle" class="pat-toggle" type="button" aria-label="显示 PAT" title="显示/隐藏">👁</button>
      </div>
      <button id="pat-save" type="button">保存到本地</button>
      <button id="pat-clear" type="button">清除</button>
    </div>
    <p class="admin-note">PAT 仅保存在当前浏览器，请仅授予 gist 权限。</p>
  </section>
</header>
<main>
  <section class="admin-panel" aria-labelledby="posts-heading">
    <div class="admin-panel-heading">
      <h2 id="posts-heading">文章列表</h2>
      <button id="new" type="button">新建</button>
    </div>
    <div class="table-wrapper">
      <table id="posts" class="table">
        <thead>
          <tr><th>标题</th><th>Slug</th><th>标签</th><th>状态</th><th>更新时间</th><th>操作</th></tr>
        </thead>
        <tbody id="posts-body"></tbody>
      </table>
    </div>
  </section>

  <section class="admin-panel" aria-labelledby="editor-heading">
    <div class="admin-panel-heading">
      <h2 id="editor-heading">新建/编辑文章</h2>
      <button id="save" class="admin-primary" type="button">保存</button>
    </div>
    <div class="admin-form-grid">
      <label>标题<input id="title" type="text"></label>
      <label class="admin-slug">Slug<input id="slug" type="text" placeholder="留空自动生成">
        <span class="admin-form-hint" id="slug-hint"></span>
      </label>
      <label>标签（逗号分隔）<input id="tags" type="text"></label>
      <label>状态<select id="status"><option value="published">published</option><option value="draft">draft</option></select></label>
      <label class="admin-col-span">摘要<input id="summary" type="text"></label>
      <label class="admin-col-span">正文（Markdown）<textarea id="body" rows="16"></textarea></label>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="res/js/admin.js"></script>
<script src="res/js/sw-register.js" defer></script>
</body>
</html>
