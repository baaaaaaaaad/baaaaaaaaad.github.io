<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>椋鸟群飞</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(to bottom, rgb(226,184,160) 0%, rgb(222,142,140) 44.4%, rgb(170,124,162) 74%, rgb(28,18,30) 74%); }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="bird-canvas" aria-hidden="true"></canvas>
  <script>
(() => {
  const cv = document.getElementById('bird-canvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const bc = document.createElement('canvas'), bx = bc.getContext('2d');
  const hc = document.createElement('canvas'), hx = hc.getContext('2d');
  const BS = .6, MAX = 8000, K = 32, KN = 6;
  let W, H, dpr, sc, cs, gw, gh, cellStart, cursor;
  const S = [
    { top: [226, 184, 160], mid: [222, 142, 140], bot: [170, 124, 162], bird: [64, 26, 50], sun: 0, hy: .74, w: .35, land: [28, 18, 30], ba: 1 },
    { top: [190, 146, 122], mid: [214, 128, 100], bot: [190, 112, 112], bird: [72, 34, 46], sun: 1, hy: .8, w: .3, land: [30, 18, 26], ba: 1 },
    { top: [72, 86, 128], mid: [146, 118, 150], bot: [228, 162, 142], bird: [70, 60, 96], sun: 0, hy: .52, w: 1, land: [36, 38, 66], ba: .8 }];
  const cur = JSON.parse(JSON.stringify(S[0]));
  let scene = 0, coh = 1, spd = 1, dens = 1, qMax = 2800, nAct = 2800, tp = 0, gs = 1, gp = 1, f = 0, m = 0, ph = 0, pt = 0, pd = 8;
  const durs = [8, 6, 12, 8, 6], PN = ['漫游散开', '聚拢', '成鲲保持', '变形穿日', '消散'], cap = () => Math.min(MAX, qMax * dens | 0);
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const mixc = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  function easeTo(dt) {
    const k = 1 - Math.exp(-dt * 1.1), T = S[scene];
    for (const n of ['top', 'mid', 'bot', 'bird', 'land']) for (let i = 0; i < 3; i++)cur[n][i] += (T[n][i] - cur[n][i]) * k;
    for (const n of ['sun', 'hy', 'w', 'ba']) cur[n] += (T[n] - cur[n]) * k;
  }

  const x = new Float32Array(MAX), y = new Float32Array(MAX), vx = new Float32Array(MAX), vy = new Float32Array(MAX),
    sx = new Float32Array(MAX), sy = new Float32Array(MAX), u = new Float32Array(MAX), o = new Float32Array(MAX),
    z = new Uint8Array(MAX), bt = new Uint8Array(MAX), vf = new Float32Array(MAX), order = new Int32Array(MAX), cellOf = new Int32Array(MAX);
  const px = new Float32Array(K + 1), py = new Float32Array(K + 1), nx = new Float32Array(K + 1), ny = new Float32Array(K + 1), prof = new Float32Array(K + 1);
  for (let k = 0; k <= K; k++) { const q = k / K; prof[k] = Math.pow(Math.sin(Math.PI * Math.pow(q, .55)), .8) * (1 - .35 * q) + .04; }
  const shore = Array.from({ length: 200 }, (_, i) => Math.random() * 5 + Math.sin(i * .3) * 2);
  const lights = Array.from({ length: 16 }, () => Math.random()), pylons = [.08, .27, .52, .71, .93];
  const ptr = { x: -1e4, y: -1e4, burst: 0 };

  function resize() {
    const width = document.documentElement.clientWidth, height = document.documentElement.clientHeight;
    const ratio = Math.min(devicePixelRatio || 1, 2);
    if (!width || !height || (W === width && H === height && dpr === ratio)) return false;
    const oldW = W, oldH = H;
    dpr = ratio; W = width; H = height;
    if (oldW && oldH) for (let i = 0; i < MAX; i++) { x[i] *= W / oldW; y[i] *= H / oldH; }
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); bc.width = Math.max(1, W * BS | 0); bc.height = Math.max(1, H * BS | 0);
    hc.width = Math.ceil(W / 10); hc.height = Math.ceil(H / 10);
    sc = Math.max(.5, Math.min(W / 1280, 1.4)); cs = Math.max(14, 22 * sc);
    gw = Math.ceil(W / cs) + 1; gh = Math.ceil(H / cs) + 1; cellStart = new Int32Array(gw * gh + 1); cursor = new Int32Array(gw * gh);
    return true;
  }
  function init() {
    for (let i = 0; i < MAX; i++) {
      x[i] = W * .5 + (Math.random() - .5) * W * .4; y[i] = H * .3 + (Math.random() - .5) * H * .15;
      const a = Math.random() * 6.283; vx[i] = Math.cos(a) * 90; vy[i] = Math.sin(a) * 90;
      const r0 = Math.random(), sg = Math.random() < .5 ? -1 : 1;
      if (r0 < .1) { bt[i] = 1; u[i] = .22 + Math.random() * .2; o[i] = sg * (.3 + Math.random() * .7); }
      else if (r0 < .22) { bt[i] = 2; u[i] = .78 + Math.random() * .22; o[i] = sg * (.3 + Math.random() * .7); }
      else { bt[i] = 0; u[i] = Math.random() * .8; o[i] = sg * (Math.random() < .5 ? .25 + Math.random() * .75 : Math.pow(Math.random(), .75)); }
      vf[i] = .85 + Math.random() * .3;
      const r = Math.random(); z[i] = r < .35 ? 0 : r < .75 ? 1 : 2;
    }
  }

  const sunPos = () => ({ x: .45 * W, y: .4 * H, r: Math.min(.12 * W, .22 * H) });

  function step(dt, t, frame) {
    const N = nAct, L = 4.2 * (1 + (1 - f) * 1.5 + m * .5), yc = cur.hy * H * .44, amp = H * .07 * (1 + .6 * m);
    for (let k = 0; k <= K; k++) {
      const tt = t - L * k / K;
      px[k] = W * (.5 + .3 * Math.sin(.19 * tt) + .07 * Math.sin(.43 * tt + 2));
      py[k] = yc + amp * Math.sin(.31 * tt + 1) + amp * .4 * Math.sin(.77 * tt);
    }
    for (let k = 0; k <= K; k++) { const a = k < K ? k : K - 1; const tx = px[a] - px[a + 1], ty = py[a] - py[a + 1], l = Math.hypot(tx, ty) || 1; nx[k] = -ty / l; ny[k] = tx / l; }
    const th = Math.min(H, W * .56) * .115 * (.85 + .2 * Math.sin(.5 * t)) * (1 + (1 - f) * 3.5);
    cellStart.fill(0);
    for (let i = 0; i < N; i++) {
      let cx = (x[i] / cs) | 0, cy = (y[i] / cs) | 0; cx = cx < 0 ? 0 : cx >= gw ? gw - 1 : cx; cy = cy < 0 ? 0 : cy >= gh ? gh - 1 : cy;
      const c = cy * gw + cx; cellOf[i] = c; cellStart[c + 1]++;
    }
    for (let c = 0; c < gw * gh; c++)cellStart[c + 1] += cellStart[c];
    cursor.set(cellStart.subarray(0, gw * gh));
    for (let i = 0; i < N; i++)order[cursor[cellOf[i]]++] = i;
    const nd = new Float32Array(KN), ni = new Int32Array(KN), sepR = 3 * sc, sepR2 = sepR * sepR;
    for (let i = frame & 1; i < N; i += 2) {
      const c = cellOf[i], cx = c % gw, cy = (c / gw) | 0; nd.fill(1e9);
      for (let gy = cy - 1; gy <= cy + 1; gy++) {
        if (gy < 0 || gy >= gh) continue;
        for (let gx = cx - 1; gx <= cx + 1; gx++) {
          if (gx < 0 || gx >= gw) continue;
          const cc = gy * gw + gx, s = cellStart[cc], e = cellStart[cc + 1], n = e - s, st = n > 10 ? Math.ceil(n / 10) : 1;
          for (let q = s + ((i + frame) % st); q < e; q += st) {
            const j = order[q]; if (j === i) continue;
            const dx = x[j] - x[i], dy = y[j] - y[i], d2 = dx * dx + dy * dy;
            if (d2 < nd[KN - 1]) { let m = KN - 1; while (m > 0 && nd[m - 1] > d2) { nd[m] = nd[m - 1]; ni[m] = ni[m - 1]; m--; } nd[m] = d2; ni[m] = j; }
          }
        }
      }
      let n = 0, avx = 0, avy = 0, mx = 0, my = 0, fx = 0, fy = 0;
      for (let m = 0; m < KN; m++) {
        if (nd[m] > 1e8) break; const j = ni[m]; n++; avx += vx[j]; avy += vy[j]; mx += x[j]; my += y[j];
        if (nd[m] < sepR2) { const d = Math.sqrt(nd[m]) || .1; const f = (1 - d / sepR) * 150 * sc / d; fx -= (x[j] - x[i]) * f; fy -= (y[j] - y[i]) * f; }
      }
      if (n) {
        avx /= n; avy /= n; mx /= n; my /= n;
        sx[i] = (avx - vx[i]) * 2.5 + (mx - x[i]) * 1.5 * coh * (.5 + f) + fx; sy[i] = (avy - vy[i]) * 2.5 + (my - y[i]) * 1.5 * coh * (.5 + f) + fy;
      }
      else { sx[i] = 0; sy[i] = 0; }
    }
    const sp = sunPos(), rep = cur.sun * (.15 + .85 * m), Rs = sp.r * .8;
    const vmax = 170 * sc * spd * gs, vmin = 60 * sc * spd * gs, pull = (.8 + 2.4 * f) * coh, sr = (130 + ptr.burst * 200) * sc, sf = 900 + ptr.burst * 2500;
    for (let i = 0; i < N; i++) {
      const k = (u[i] * K) | 0, q = u[i], b = bt[i]; let off;
      if (b === 0) off = o[i] * th * prof[k];
      else if (b === 1) off = (o[i] < 0 ? -1 : 1) * th * (.7 + (q - .22) * 7) * (.5 + .5 * Math.abs(o[i]));
      else off = (o[i] < 0 ? -1 : 1) * th * (.25 + (q - .78) * 5) * (.7 + .3 * Math.abs(o[i]));
      let ax = (px[k] + nx[k] * off - x[i]) * pull + sx[i] + Math.sin(t * 1.7 + i * .91) * (15 + 60 * (1 - f)) * sc;
      let ay = (py[k] + ny[k] * off - y[i]) * pull + sy[i] + Math.cos(t * 1.3 + i * .57) * (15 + 60 * (1 - f)) * sc;
      if (rep > .01) {
        const dx = x[i] - sp.x, dy = y[i] - sp.y, d = Math.hypot(dx, dy);
        if (d < Rs) { const f = (1 - d / Rs) * rep * 520 * sc / (d || 1); ax += dx * f; ay += dy * f; }
      }
      const dx = x[i] - ptr.x, dy = y[i] - ptr.y, d2 = dx * dx + dy * dy;
      if (d2 < sr * sr) { const d = Math.sqrt(d2) || 1, f = (1 - d / sr) * sf * sc / d; ax += dx * f; ay += dy * f; }
      vx[i] += ax * dt; vy[i] += ay * dt;
      const s = Math.hypot(vx[i], vy[i]) || 1, lim = (ptr.burst > 0 ? vmax * 1.8 : vmax) * vf[i] * (1.1 - .25 * u[i]);
      const fc = s > lim ? lim / s : s < vmin ? vmin / s : 1; vx[i] *= fc; vy[i] *= fc;
      x[i] += vx[i] * dt; y[i] += vy[i] * dt;
    }
    if (ptr.burst > 0) ptr.burst = Math.max(0, ptr.burst - dt);
  }

  function drawBirds() {
    const N = nAct; bx.setTransform(1, 0, 0, 1, 0, 0); bx.clearRect(0, 0, bc.width, bc.height); bx.setTransform(BS, 0, 0, BS, 0, 0); bx.lineCap = 'round';
    const LW = [1.5, 2, 2.6], AL = [.26, .46, .68], LN = [.02, .03, .04];
    for (let l = 0; l < 3; l++) {
      bx.strokeStyle = rgb(l === 0 ? mixc(cur.bird, cur.bot, .45) : cur.bird, AL[l]); bx.lineWidth = LW[l]; bx.beginPath();
      for (let i = 0; i < N; i++) { if (z[i] !== l) continue; bx.moveTo(x[i], y[i]); bx.lineTo(x[i] - vx[i] * LN[l], y[i] - vy[i] * LN[l]); }
      bx.stroke();
    }
    hx.clearRect(0, 0, hc.width, hc.height); hx.drawImage(bc, 0, 0, hc.width, hc.height);
  }

  function paint(ga) {
    const hy = cur.hy * H;
    const g = ctx.createLinearGradient(0, 0, 0, hy); g.addColorStop(0, rgb(cur.top)); g.addColorStop(.6, rgb(cur.mid)); g.addColorStop(1, rgb(cur.bot));
    ctx.globalAlpha = ga; ctx.fillStyle = g; ctx.fillRect(0, 0, W, hy + 1);
    if (cur.sun > .01) {
      const s = sunPos();
      let r = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3); r.addColorStop(0, 'rgba(255,170,110,.4)'); r.addColorStop(1, 'rgba(255,140,100,0)');
      ctx.globalAlpha = ga * cur.sun; ctx.fillStyle = r; ctx.fillRect(s.x - s.r * 3, s.y - s.r * 3, s.r * 6, s.r * 6);
      r = ctx.createRadialGradient(s.x, s.y - s.r * .3, 0, s.x, s.y, s.r); r.addColorStop(0, 'rgb(255,200,100)'); r.addColorStop(.55, 'rgb(244,122,82)'); r.addColorStop(1, 'rgb(226,80,76)');
      ctx.fillStyle = r; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = ga * cur.ba * .4; ctx.drawImage(hc, 0, 0, W, H);
    ctx.globalAlpha = ga * cur.ba; ctx.drawImage(bc, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const hy = cur.hy * H; paint(1);
    ctx.fillStyle = rgb(cur.land); ctx.fillRect(0, hy, W, H - hy + 1);
    if (cur.w > .02) {
      ctx.save(); ctx.beginPath(); ctx.rect(0, hy, W, H - hy); ctx.clip(); ctx.translate(0, 2 * hy); ctx.scale(1, -1); paint(.6 * cur.w); ctx.restore();
      const g = ctx.createLinearGradient(0, hy, 0, H); g.addColorStop(0, rgb(cur.land, 0)); g.addColorStop(1, rgb(cur.land, .85)); ctx.fillStyle = g; ctx.fillRect(0, hy, W, H - hy);
      ctx.fillStyle = rgb(cur.mid, .07 * cur.w);
      for (let r = 0; r < 12; r++) { const yy = hy + (H - hy) * Math.pow(r / 12, 1.6) + 2; ctx.fillRect(W * .2 + Math.sin(t * .5 + r) * 30, yy, W * .5, 1.5); }
    }
    ctx.fillStyle = rgb(cur.land); ctx.beginPath(); ctx.moveTo(0, hy + 1);
    for (let i = 0; i <= W / 10 + 1; i++)ctx.lineTo(i * 10, hy - shore[i % 200] * sc);
    ctx.lineTo(W, hy + 1); ctx.fill();
    ctx.strokeStyle = rgb(cur.land, .9); ctx.lineWidth = 1; ctx.beginPath();
    for (const p of pylons) { const X = p * W, h = (14 + p * 10) * sc; ctx.moveTo(X, hy); ctx.lineTo(X, hy - h); ctx.moveTo(X - h * .4, hy - h * .8); ctx.lineTo(X + h * .4, hy - h * .8); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,236,196,.9)';
    for (const l of lights) { ctx.beginPath(); ctx.arc(l * W, hy - 1, 1.4 * sc + .4, 0, 6.283); ctx.fill(); }
    const v = ctx.createLinearGradient(0, H * .8, 0, H); v.addColorStop(0, 'rgba(10,6,12,0)'); v.addColorStop(1, 'rgba(10,6,12,.5)'); ctx.fillStyle = v; ctx.fillRect(0, H * .8, W, H * .2);
  }
  function setPointer(type, x, y, pointerType) {
    if (type === 'leave' || (type === 'up' && pointerType !== 'mouse')) { ptr.x = ptr.y = -1e4; return; }
    if (type === 'move' || type === 'down') { ptr.x = x; ptr.y = y; if (type === 'down') ptr.burst = .6; }
  }
  for (const type of ['pointermove', 'pointerdown', 'pointerup']) {
    addEventListener(type, e => setPointer(type.slice(7), e.clientX, e.clientY, e.pointerType));
  }
  document.addEventListener('pointerleave', () => setPointer('leave'));
  addEventListener('message', e => {
    const data = e.data;
    if (e.source !== parent || !data || data.channel !== 'bird-pointer' || !['move', 'down', 'up', 'leave'].includes(data.type)) return;
    if (data.type !== 'leave' && (!Number.isFinite(data.x) || !Number.isFinite(data.y))) return;
    setPointer(data.type, data.x, data.y, data.pointerType);
  });

  function isLowEnd() {
    const mem = navigator.deviceMemory;
    if (typeof mem === 'number' && mem <= 2) return true;
    const cores = navigator.hardwareConcurrency;
    if (typeof cores === 'number' && cores <= 2) return true;
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn && conn.saveData) return true;
    return false;
  }

  let last = 0, t = 0, frame = 0, ema = 16.7, animation = 0, initialized = false;
  function renderSize() {
    if (!resize()) return;
    if (!initialized) { init(); initialized = true; }
    drawBirds(); draw(t);
  }
  function updateMotion() {
    if (animation) cancelAnimationFrame(animation);
    animation = 0; last = 0;
    if (!isLowEnd() && initialized) animation = requestAnimationFrame(loop);
  }
  addEventListener('resize', () => { renderSize(); if (!animation) updateMotion(); });
  renderSize();
  updateMotion();

  function loop(ms) {
    animation = requestAnimationFrame(loop);
    const dt = Math.min((ms - last) / 1000 || .016, .05); last = ms; t += dt; frame++;
    ema += (dt * 1000 - ema) * .05;
    if (frame % 60 === 0) { if (ema > 24 && nAct > 1500) nAct = Math.max(1500, nAct * .88 | 0); else if (ema < 17.5 && nAct < cap()) nAct = Math.min(cap(), (nAct * 1.05 | 0) + 10); }
    pt += dt;
    if (pt >= pd) { ph = (ph + 1) % 5; pt = 0; pd = durs[ph] * (.8 + Math.random() * .4); if (ph === 0) scene = (scene + 1) % 3; }
    const pr = Math.min(1, pt / pd), sm = pr * pr * (3 - 2 * pr);
    f = ph === 0 ? 0 : ph === 1 ? sm : ph === 4 ? 1 - sm : 1;
    m += ((ph === 3 ? 1 : 0) - m) * (1 - Math.exp(-dt * 1.2));
    gp += ([.7, 1.35, .8, 1.5, 1][ph] - gp) * (1 - Math.exp(-dt * 1.5));
    gs = gp * (1 + .3 * Math.sin(.23 * t) + .12 * Math.sin(.61 * t + 1)); tp += dt * gs;
    easeTo(dt); step(dt, tp, frame); drawBirds(); draw(t);
  }
})();  </script>
</body>
